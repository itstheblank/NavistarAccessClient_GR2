# Mosquitto CHỈ ĐỂ TEST TRÊN LAPTOP (Mosquitto 2.x hỗ trợ MQTT 5).
# Chạy:  "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto_dev.conf -v
# Không kiểm tra token: app vẫn gửi username=MAC, password=token nhưng Mosquitto chấp nhận mọi giá trị.
listener 1883 0.0.0.0
allow_anonymous true
# Phiên (clean start = false) được giữ trong RAM khi Mosquitto còn chạy; tắt Mosquitto là mất (đủ cho test)
persistence false
